spring.application.name=order_service
server.port=${SERVER_PORT:8083}

# Datasource (override with environment variables outside local development)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/elurea_order_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Pagination
spring.data.web.pageable.max-page-size=100

# Errors: never leak stack traces or exception messages to clients
server.error.include-stacktrace=never
server.error.include-message=never

# --- Application settings ---

# JWT issued by the user service: secret and issuer MUST match the user service configuration.
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
app.jwt.issuer=elurea-user-service

# Browser origins allowed to call the API (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Other services
app.services.user-url=${USER_SERVICE_URL:http://localhost:8081}
app.services.product-url=${PRODUCT_SERVICE_URL:http://localhost:8082}
app.services.payment-url=${PAYMENT_SERVICE_URL:http://localhost:8084}
# Shared service-to-service key: sent to the product and payment services, and accepted from the
# payment service on /internal/**. Must be the same INTERNAL_API_KEY in every service.
app.services.internal-api-key=${INTERNAL_API_KEY:local-dev-internal-key}
app.services.connect-timeout=2s
app.services.read-timeout=5s

# Unpaid ONLINE orders are cancelled (and their stock released) after this delay.
app.orders.unpaid-online-ttl=${UNPAID_ORDER_TTL:30m}
app.orders.expiry-check-interval=${UNPAID_ORDER_CHECK_INTERVAL:1m}
